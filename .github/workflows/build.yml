name: Build AppStoreVersionSpoofer

on:
  push:
    branches: [ main, master, macpad-probe ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make perl build-essential \
            libcurl4-openssl-dev libxml2-dev fakeroot dpkg-dev bzip2 \
            libtinfo6 xz-utils rsync zip
          # 优先用 sysv 版 fakeroot，规避部分发行版 tcp 限制（Theos 官方安装脚本同款处理）
          sudo update-alternatives --set fakeroot /usr/bin/fakeroot-sysv 2>/dev/null || true

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Download iOS toolchain (Linux clang for iOS/arm64)
        run: |
          # Theos 官方 Linux 工具链来自 L1ghtmann/llvm-project 的预编译 release
          curl -sL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz \
            | tar -xJ -C "$THEOS/toolchain/"
          echo "--- 验证 clang ---"
          "$THEOS/toolchain/linux/iphone/bin/clang" --version

      - name: Download iOS 12.4 SDK (patched, 含私有框架 tbd)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$THEOS/sdks"
          # theos/sdks 的 release 资产中包含 iPhoneOS12.4.sdk.tar.xz（按版本精确选取）
          SDK_URL=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/theos/sdks/releases/latest" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print([a['browser_download_url'] for a in d['assets'] if a['name']=='iPhoneOS12.4.sdk.tar.xz'][0])")
          echo "SDK_URL=$SDK_URL"
          curl -sL "$SDK_URL" | tar -xJ -C "$THEOS/sdks"
          ls -1 "$THEOS/sdks"

      - name: Compile package (tweak + standalone app)
        run: |
          export THEOS="$THEOS"
          make clean
          make package FINALPACKAGE=1

      - name: Package IPAs
        # macpad-ipa-v4
        run: |
          set -e
          rm -rf ipapkg && mkdir -p ipapkg
          APPS=$(find . -maxdepth 5 -type d -name "*.app" -not -path "*/Payload/*" -not -path "./ipapkg/*" | sort)
          echo "找到的 app bundle:"; echo "$APPS"
          [ -n "$APPS" ] || { echo "没有任何 .app"; find . -name "*.app" -maxdepth 6; exit 1; }
          for APP in $APPS; do
            NAME=$(basename "$APP" .app)
            echo; echo "=== 打包 $NAME ==="
            rm -rf ipapkg/$NAME && mkdir -p ipapkg/$NAME/Payload
            cp -R "$APP" "ipapkg/$NAME/Payload/$NAME.app"
            if [ ! -f "ipapkg/$NAME/Payload/$NAME.app/Info.plist" ]; then
              if [ -f "$NAME-Info.plist" ]; then
                cp "$NAME-Info.plist" "ipapkg/$NAME/Payload/$NAME.app/Info.plist"
                echo "已补 $NAME-Info.plist"
              else
                echo "警告：$NAME 缺 Info.plist"
              fi
            fi
            ( cd "ipapkg/$NAME" && zip -qry "../$NAME.ipa" Payload )
            ls -l "ipapkg/$NAME.ipa"
            find "ipapkg/$NAME/Payload/$NAME.app" -maxdepth 1 -type f | sort | head -20
          done
          echo "--- packages/ 内容（deb 应在此）---"
          ls -l packages || true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacPad-ipa
          path: ipapkg/*.ipa

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppStoreVersionSpoofer-deb
          path: packages/*.deb
